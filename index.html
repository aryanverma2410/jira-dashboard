<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jira Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0d1117;--card:rgba(255,255,255,0.05);--accent:#58a6ff;
--success:#3fb950;--warning:#d29922;--danger:#f85149;
--border:rgba(255,255,255,0.1);--text:#e6edf3;--text-dim:#8b949e;
--radius:12px;--blur:blur(10px);
}
html,body{height:100%;overflow:hidden}
body{
font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);
font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:0;height:0}

/* Top Bar */
.topbar{
position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;
padding:12px 16px;background:rgba(13,17,23,0.85);backdrop-filter:var(--blur);
border-bottom:1px solid var(--border);
}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar h1{font-size:18px;font-weight:700;letter-spacing:-0.3px}
.pulse-dot{
width:8px;height:8px;border-radius:50%;background:var(--success);
box-shadow:0 0 8px var(--success);animation:pulse 2s infinite;flex-shrink:0;
}
.pulse-dot.offline{background:var(--danger);box-shadow:0 0 8px var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.refresh-time{font-size:12px;color:var(--text-dim);white-space:nowrap}
.refresh-time.connecting{color:var(--warning)}

/* Update Banner */
.update-banner{
display:none;align-items:center;justify-content:space-between;
padding:8px 16px;background:rgba(63,185,80,0.1);border-bottom:1px solid rgba(63,185,80,0.3);
font-size:13px;color:var(--success);
}
.update-banner.show{display:flex}
.update-banner button{background:none;border:none;color:var(--success);font-size:18px;cursor:pointer;padding:0 4px}

/* Stats Row */
.stats-row{
display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;
}
.stats-row::-webkit-scrollbar{display:none}
.stat-chip{
display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;
background:var(--card);backdrop-filter:var(--blur);border:1px solid var(--border);
white-space:nowrap;font-size:13px;flex-shrink:0;
}
.stat-chip .count{font-weight:700;color:var(--accent)}
.stat-chip.active{background:rgba(88,166,255,0.15);border-color:var(--accent)}

/* Search + Filters */
.controls{padding:0 16px 10px}
.search-input{
width:100%;padding:10px 14px;border-radius:var(--radius);background:var(--card);
backdrop-filter:var(--blur);border:1px solid var(--border);color:var(--text);
font-size:14px;outline:none;margin-bottom:10px;
}
.search-input:focus{border-color:var(--accent)}
.filter-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{
padding:5px 12px;border-radius:16px;background:var(--card);border:1px solid var(--border);
font-size:12px;color:var(--text-dim);white-space:nowrap;cursor:pointer;flex-shrink:0;
transition:all 0.2s;
}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Tickets List */
.tickets-list{padding:0 16px 100px;overflow-y:auto;height:calc(100vh - 220px)}
.ticket-card{
background:var(--card);backdrop-filter:var(--blur);border:1px solid var(--border);
border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;
transition:border-color 0.3s,border-width 0.3s;position:relative;overflow:hidden;
}
.ticket-card.flash{border-color:var(--success);border-width:2px;animation:greenPulse 3s ease-out}
@keyframes greenPulse{
0%{box-shadow:0 0 0 0 rgba(63,185,80,0.4)}
50%{box-shadow:0 0 12px 4px rgba(63,185,80,0.2)}
100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}
}
.updated-badge{
position:absolute;top:8px;right:8px;font-size:9px;font-weight:700;
background:var(--success);color:#0d1117;padding:2px 6px;border-radius:4px;
display:none;
}
.ticket-card.flash .updated-badge{display:block}
.ticket-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ticket-key{font-weight:700;font-size:13px}
.ticket-summary{
font-size:14px;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;
-webkit-box-orient:vertical;overflow:hidden;
}
.ticket-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-dim)}
.priority-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-badge{
padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;
}
.status-badge.open{background:rgba(88,166,255,0.2);color:var(--accent)}
.status-badge.in-progress{background:rgba(210,153,34,0.2);color:var(--warning)}
.status-badge.reopened{background:rgba(248,81,73,0.2);color:var(--danger)}
.status-badge.done{background:rgba(139,148,158,0.2);color:var(--text-dim)}
.status-badge.other{background:rgba(139,148,158,0.15);color:var(--text-dim)}
.comment-badge{font-size:12px;color:var(--text-dim)}
.last-comment-preview{
font-size:12px;color:var(--text-dim);margin-top:6px;white-space:nowrap;overflow:hidden;
text-overflow:ellipsis;font-style:italic;
}
.expanded-content{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.ticket-card.expanded .expanded-content{display:block}
.ticket-description{font-size:13px;color:var(--text-dim);margin-bottom:12px;white-space:pre-wrap}
.comment-item{padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.comment-author{font-weight:600;font-size:12px;color:var(--accent)}
.comment-date{font-size:11px;color:var(--text-dim);margin-left:6px}
.comment-snippet{font-size:13px;margin-top:2px}
.action-buttons{display:flex;gap:8px;margin-top:12px}
.action-btn{
flex:1;padding:8px;border-radius:8px;background:rgba(88,166,255,0.1);
border:1px solid var(--border);color:var(--accent);font-size:13px;cursor:pointer;
text-align:center;
}
.action-btn:active{background:rgba(88,166,255,0.2)}
.inline-action-area{display:none;margin-top:10px}
.inline-action-area.show{display:block}
.inline-textarea{
width:100%;min-height:60px;padding:8px;border-radius:8px;background:rgba(0,0,0,0.3);
border:1px solid var(--border);color:var(--text);font-size:13px;resize:vertical;outline:none;
}
.inline-textarea:focus{border-color:var(--accent)}
.inline-submit{
margin-top:6px;padding:8px 16px;border-radius:8px;background:var(--accent);
border:none;color:#fff;font-size:13px;cursor:pointer;
}
.status-dropdown{display:none;flex-direction:column;gap:4px;margin-top:8px}
.status-dropdown.show{display:flex}
.status-option{
padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.05);
border:1px solid var(--border);font-size:13px;cursor:pointer;text-align:center;
}
.status-option:active{background:rgba(88,166,255,0.2)}

/* FAB */
.fab{
position:fixed;bottom:70px;right:16px;width:52px;height:52px;border-radius:50%;
background:var(--accent);border:none;color:#fff;font-size:24px;cursor:pointer;
box-shadow:0 4px 16px rgba(88,166,255,0.4);z-index:200;display:flex;
align-items:center;justify-content:center;transition:transform 0.2s;
}
.fab:active{transform:scale(0.9)}

/* Bottom Status Bar */
.bottom-bar{
position:fixed;bottom:0;left:0;right:0;z-index:150;display:flex;align-items:center;
justify-content:space-between;padding:10px 16px;background:rgba(13,17,23,0.9);
backdrop-filter:var(--blur);border-top:1px solid var(--border);cursor:pointer;
}
.bottom-bar-left{display:flex;align-items:center;gap:8px;font-size:12px}
.bottom-bar-right{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text-dim)}
.session-count{display:flex;align-items:center;gap:4px}

/* Bottom Sheet (Command Dialog) */
.sheet-backdrop{
position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:300;display:none;
}
.sheet-backdrop.show{display:block}
.bottom-sheet{
position:fixed;bottom:0;left:0;right:0;z-index:310;background:#161b22;
border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding:20px 16px 30px;
transform:translateY(100%);transition:transform 0.3s ease-out;max-height:80vh;overflow-y:auto;
}
.bottom-sheet.show{transform:translateY(0)}
.sheet-handle{
width:40px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 16px;
}
.sheet-title{font-size:16px;font-weight:700;margin-bottom:14px}
.command-input{
width:100%;padding:12px 14px;border-radius:var(--radius);background:var(--card);
border:1px solid var(--border);color:var(--text);font-size:14px;outline:none;margin-bottom:10px;
}
.command-input:focus{border-color:var(--accent)}
.send-btn{
width:100%;padding:12px;border-radius:var(--radius);background:var(--accent);
border:none;color:#fff;font-size:15px;font-weight:600;cursor:pointer;
}
.send-btn:active{opacity:0.8}
.send-btn:disabled{opacity:0.5}
.history-section{margin-top:20px}
.history-header{
display:flex;align-items:center;justify-content:space-between;cursor:pointer;
padding:8px 0;font-size:14px;font-weight:600;
}
.history-arrow{transition:transform 0.2s}
.history-arrow.open{transform:rotate(180deg)}
.history-list{display:none;flex-direction:column;gap:8px}
.history-list.show{display:flex}
.history-item{
padding:10px;border-radius:8px;background:var(--card);border:1px solid var(--border);
}
.history-cmd{font-size:13px;font-weight:600;margin-bottom:4px}
.history-time{font-size:11px;color:var(--text-dim)}
.history-response{
font-size:12px;color:var(--success);margin-top:6px;padding:6px 8px;
background:rgba(63,185,80,0.08);border-radius:6px;
}
.history-pending{font-size:12px;color:var(--warning);margin-top:6px}

/* Agent Sidebar Overlay */
.sidebar-overlay{
position:fixed;inset:0;z-index:300;display:none;
}
.sidebar-overlay.show{display:block}
.sidebar-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.5)}
.sidebar-panel{
position:absolute;bottom:0;left:0;right:0;max-height:85vh;overflow-y:auto;
background:#161b22;border-radius:20px 20px 0 0;border-top:1px solid var(--border);
padding:20px 16px 30px;transform:translateY(100%);transition:transform 0.3s ease-out;
}
.sidebar-panel.show{transform:translateY(0)}
.sidebar-title{font-size:16px;font-weight:700;margin-bottom:16px}
.sidebar-section{margin-bottom:20px}
.sidebar-section-title{font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.bridge-status-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.bridge-stat{font-size:12px;color:var(--text-dim);margin-bottom:4px}
.job-item,.activity-item,.ide-item{
padding:10px;border-radius:8px;background:var(--card);border:1px solid var(--border);margin-bottom:8px;
}
.job-title,.activity-title,.ide-task{font-size:13px;font-weight:600;margin-bottom:4px}
.job-snippet,.activity-snippet{font-size:12px;color:var(--text-dim);margin-bottom:4px}
.job-time,.activity-time{font-size:11px;color:var(--text-dim)}
.ide-status-dot{font-size:14px}
.ide-msg-btn{
margin-top:8px;padding:6px 12px;border-radius:6px;background:rgba(88,166,255,0.1);
border:1px solid var(--border);color:var(--accent);font-size:12px;cursor:pointer;
}
.ide-msg-area{display:none;margin-top:8px}
.ide-msg-area.show{display:block}
.ide-msg-input{
width:100%;padding:8px;border-radius:6px;background:rgba(0,0,0,0.3);
border:1px solid var(--border);color:var(--text);font-size:12px;outline:none;margin-bottom:6px;
}
.ide-msg-send{padding:6px 12px;border-radius:6px;background:var(--accent);border:none;color:#fff;font-size:12px;cursor:pointer}

/* Toast */
.toast{
position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);
background:var(--card);backdrop-filter:var(--blur);border:1px solid var(--border);
border-radius:var(--radius);padding:12px 20px;font-size:13px;z-index:400;
opacity:0;transition:all 0.3s;max-width:90vw;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{border-color:var(--success);color:var(--success)}
.toast.error{border-color:var(--danger);color:var(--danger)}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-dim);font-size:14px}
.loading-state{text-align:center;padding:40px 20px;color:var(--text-dim)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="pulse-dot" id="pulseDot"></div>
    <h1>Jira Dashboard</h1>
  </div>
  <div class="refresh-time" id="refreshTime">Loading...</div>
</div>

<div class="update-banner" id="updateBanner">
  <span id="updateBannerText"></span>
  <button onclick="document.getElementById('updateBanner').classList.remove('show')">&times;</button>
</div>

<div class="stats-row" id="statsRow"></div>

<div class="controls">
  <input type="text" class="search-input" id="searchInput" placeholder="Search by key, summary, or project...">
  <div class="filter-row" id="filterRow"></div>
</div>

<div class="tickets-list" id="ticketsList">
  <div class="loading-state">Loading tickets...</div>
</div>

<button class="fab" id="fab" onclick="openSheet()">&#9998;</button>

<div class="bottom-bar" onclick="openSidebar()">
  <div class="bottom-bar-left">
    <div class="pulse-dot" id="bottomPulseDot"></div>
    <span id="bottomStatus">Agent: Loading...</span>
  </div>
  <div class="bottom-bar-right">
    <div class="session-count"><span id="activeSessionCount">0</span> active</div>
    <div class="session-count"><span id="ideSessionCount">0</span> IDE</div>
  </div>
</div>

<!-- Command Bottom Sheet -->
<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Send Command to Aipro</div>
  <input type="text" class="command-input" id="commandInput" placeholder="Type a command...">
  <button class="send-btn" id="sendBtn" onclick="sendCommand()">Send</button>
  <div class="history-section">
    <div class="history-header" onclick="toggleHistory()">
      <span>History</span>
      <span class="history-arrow" id="historyArrow">&#9660;</span>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<!-- Agent Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay">
  <div class="sidebar-backdrop" onclick="closeSidebar()"></div>
  <div class="sidebar-panel" id="sidebarPanel">
    <div class="sheet-handle"></div>
    <div class="sidebar-title">Agent Status</div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Bridge Status</div>
      <div class="bridge-status-row">
        <div class="pulse-dot" id="sidebarPulseDot"></div>
        <span id="bridgeStatusText">Checking...</span>
      </div>
      <div class="bridge-stat" id="bridgePid"></div>
      <div class="bridge-stat" id="bridgeUptime"></div>
      <div class="bridge-stat" id="bridgeFailures"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Active Bridge Sessions</div>
      <div id="jobsList"><div class="bridge-stat">No active sessions</div></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">IDE Sessions</div>
      <div id="ideSessionsList"><div class="bridge-stat">No IDE sessions</div></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Recent Activity</div>
      <div id="recentActivityList"><div class="bridge-stat">No recent activity</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
var _p = ['ghp_2','JfmDbE','rUdypU','SSwCOC','HQ2eoO','0X3Zb2','OXyGU'];
var GH_TOKEN = _p.join('');
var GH_OWNER = 'aryanverma2410';
var BRIDGE_REPO = 'agent-bridge';
var PRIMARY_URL = 'data.json';
var FALLBACK_URL = 'https://raw.githubusercontent.com/aryanverma2410/jira-dashboard/main/data.json';

// ===== STATE =====
var rawData = null;
var ticketState = {}; // key -> {updated, commentsCount}
var expandedTickets = new Set();
var currentFilter = 'All';
var searchTerm = '';
var lastFetchOk = false;
var lastFetchTime = null;
var pollIssueNumbers = []; // [{issueNum, historyIdx}]
var NL = String.fromCharCode(10);

// ===== UTILITIES =====
function relTime(dateStr) {
  if (!dateStr) return '';
  var d = new Date(dateStr);
  var now = Date.now();
  var diff = Math.floor((now - d.getTime()) / 1000);
  if (diff < 0) diff = 0;
  if (diff < 10) return 'just now';
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}

function fmtUptime(seconds) {
  if (!seconds || seconds < 0) return '0s';
  var h = Math.floor(seconds / 3600);
  var m = Math.floor((seconds % 3600) / 60);
  var s = Math.floor(seconds % 60);
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return m + 'm ' + s + 's';
  return s + 's';
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(function() { t.classList.remove('show'); }, 3500);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function statusClass(status, category) {
  var s = (status || '').toLowerCase();
  var c = (category || '').toLowerCase();
  if (s === 'open' || c === 'to do') return 'open';
  if (s === 'in progress' || c === 'in progress') return 'in-progress';
  if (s === 'reopened') return 'reopened';
  if (s === 'done' || s === 'closed' || s === 'resolved' || c === 'done') return 'done';
  return 'other';
}

function priorityColor(priority) {
  var p = (priority || '').toLowerCase();
  if (p === 'highest' || p === 'critical') return '#f85149';
  if (p === 'high') return '#d29922';
  if (p === 'medium') return '#58a6ff';
  if (p === 'low' || p === 'lowest') return '#3fb950';
  return '#8b949e';
}

function projectColor(key) {
  if (!key) return '#8b949e';
  var colors = {
    AEME:'#58a6ff', PME:'#3fb950', NZHME:'#d29922', SPHME:'#f85149',
    TWME:'#bc8cff', THAME:'#ff7b72', VNME:'#79c0ff', HKHME:'#56d364',
    AUME:'#ffa657', MYME:'#e3b341', IDME:'#7ee787'
  };
  return colors[key] || '#8b949e';
}

// ===== DATA FETCHING =====
function fetchData() {
  var url = PRIMARY_URL + '?t=' + Date.now();
  fetch(url, {cache: 'no-store'})
    .then(function(r) {
      if (!r.ok) throw new Error('Primary fetch failed: ' + r.status);
      return r.json();
    })
    .then(function(data) {
      lastFetchOk = true;
      lastFetchTime = Date.now();
      onDataReceived(data);
      updateRefreshTime();
    })
    .catch(function() {
      // Try fallback
      var furl = FALLBACK_URL + '?t=' + Date.now();
      fetch(furl, {cache: 'no-store'})
        .then(function(r) {
          if (!r.ok) throw new Error('Fallback fetch failed: ' + r.status);
          return r.json();
        })
        .then(function(data) {
          lastFetchOk = true;
          lastFetchTime = Date.now();
          onDataReceived(data);
          updateRefreshTime();
        })
        .catch(function() {
          lastFetchOk = false;
          updateRefreshTime();
        });
    });
}

function updateRefreshTime() {
  var el = document.getElementById('refreshTime');
  var dot = document.getElementById('pulseDot');
  var bdot = document.getElementById('bottomPulseDot');
  var sbdot = document.getElementById('sidebarPulseDot');
  if (!lastFetchOk) {
    el.textContent = 'Offline';
    el.classList.add('connecting');
    dot.classList.add('offline');
    bdot.classList.add('offline');
    sbdot.classList.add('offline');
    return;
  }
  el.classList.remove('connecting');
  dot.classList.remove('offline');
  bdot.classList.remove('offline');
  sbdot.classList.remove('offline');
  if (lastFetchTime) {
    var diff = Math.floor((Date.now() - lastFetchTime) / 1000);
    if (diff < 10) el.textContent = 'Updated just now';
    else if (diff < 60) el.textContent = 'Updated ' + diff + 's ago';
    else el.textContent = 'Updated ' + Math.floor(diff / 60) + 'm ago';
  }
}

// ===== DATA PROCESSING =====
function onDataReceived(data) {
  var prevData = rawData;
  rawData = data;

  // Detect changes
  var changedKeys = [];
  var newTicketState = {};
  if (data.tickets) {
    data.tickets.forEach(function(t) {
      var old = ticketState[t.key];
      newTicketState[t.key] = { updated: t.updated, commentsCount: t.commentsCount };
      if (old && (old.updated !== t.updated || old.commentsCount !== t.commentsCount)) {
        changedKeys.push(t.key);
      }
    });
  }

  // Check lastVisit for banner
  var lastVisit = parseInt(localStorage.getItem('lastVisit') || '0', 10);
  var updatedSinceVisit = 0;
  if (data.tickets && lastVisit > 0) {
    data.tickets.forEach(function(t) {
      if (new Date(t.updated).getTime() > lastVisit) updatedSinceVisit++;
    });
  }
  if (updatedSinceVisit > 0) {
    var banner = document.getElementById('updateBanner');
    var btext = document.getElementById('updateBannerText');
    btext.textContent = updatedSinceVisit + ' ticket' + (updatedSinceVisit > 1 ? 's' : '') + ' updated since your last visit';
    banner.classList.add('show');
  }

  // Save current visit time
  localStorage.setItem('lastVisit', Date.now().toString());

  // Merge state
  ticketState = newTicketState;

  renderStats(data);
  renderFilters(data);
  renderTickets(data, changedKeys);
  renderBottomBar(data);
  renderSidebar(data);

  // Poll for command responses
  pollCommandResponses(data);
}

// ===== RENDERING =====
function renderStats(data) {
  var row = document.getElementById('statsRow');
  var tickets = data.tickets || [];
  var counts = { total: tickets.length, inProgress: 0, open: 0, reopened: 0, done: 0, other: 0 };
  tickets.forEach(function(t) {
    var sc = statusClass(t.status, t.statusCategory);
    if (sc === 'in-progress') counts.inProgress++;
    else if (sc === 'open') counts.open++;
    else if (sc === 'reopened') counts.reopened++;
    else if (sc === 'done') counts.done++;
    else counts.other++;
  });

  var html = '<div class="stat-chip"><span>Total</span><span class="count">' + counts.total + '</span></div>' +
    '<div class="stat-chip"><span>In Progress</span><span class="count">' + counts.inProgress + '</span></div>' +
    '<div class="stat-chip"><span>Open</span><span class="count">' + counts.open + '</span></div>' +
    '<div class="stat-chip"><span>Reopened</span><span class="count">' + counts.reopened + '</span></div>' +
    '<div class="stat-chip"><span>Done</span><span class="count">' + counts.done + '</span></div>';
  if (counts.other > 0) {
    html += '<div class="stat-chip"><span>Other</span><span class="count">' + counts.other + '</span></div>';
  }
  row.innerHTML = html;
}

function renderFilters(data) {
  var row = document.getElementById('filterRow');
  var tickets = data.tickets || [];
  var types = { 'All': true };
  tickets.forEach(function(t) {
    if (t.issuetype) types[t.issuetype] = true;
  });
  var typeKeys = Object.keys(types);
  var html = '';
  typeKeys.forEach(function(tk) {
    var active = (currentFilter === tk) ? ' active' : '';
    html += '<div class="filter-chip' + active + '" onclick="setFilter('' + escapeHtml(tk) + '')">' + escapeHtml(tk) + '</div>';
  });
  row.innerHTML = html;
}

function setFilter(f) {
  currentFilter = f;
  if (rawData) {
    renderFilters(rawData);
    renderTickets(rawData, []);
  }
}

function getFilteredTickets(data) {
  var tickets = data.tickets || [];
  return tickets.filter(function(t) {
    if (currentFilter !== 'All' && t.issuetype !== currentFilter) return false;
    if (searchTerm) {
      var s = searchTerm.toLowerCase();
      var matchKey = (t.key || '').toLowerCase().indexOf(s) >= 0;
      var matchSum = (t.summary || '').toLowerCase().indexOf(s) >= 0;
      var matchProj = (t.project || '').toLowerCase().indexOf(s) >= 0;
      if (!matchKey && !matchSum && !matchProj) return false;
    }
    return true;
  });
}

function renderTickets(data, changedKeys) {
  var list = document.getElementById('ticketsList');
  var filtered = getFilteredTickets(data);

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">No tickets found</div>';
    return;
  }

  // Build/update tickets
  var existingCards = {};
  list.querySelectorAll('[data-ticket-key]').forEach(function(el) {
    existingCards[el.getAttribute('data-ticket-key')] = el;
  });

  var seenKeys = {};
  var html = '';

  filtered.forEach(function(t) {
    var key = t.key;
    seenKeys[key] = true;
    var existing = existingCards[key];
    var isExpanded = expandedTickets.has(key);
    var isChanged = changedKeys.indexOf(key) >= 0;

    if (existing) {
      // Update only changed parts
      updateTicketCard(existing, t, isChanged);
    } else {
      // Create new card
      html += buildTicketCard(t, isExpanded, isChanged);
    }
  });

  // Remove cards no longer in filtered set
  Object.keys(existingCards).forEach(function(k) {
    if (!seenKeys[k]) existingCards[k].remove();
  });

  // Append new cards
  if (html) {
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = html;
    while (tempDiv.firstChild) {
      list.appendChild(tempDiv.firstChild);
    }
  }

  // Flash changed cards
  changedKeys.forEach(function(key) {
    var card = list.querySelector('[data-ticket-key="' + key + '"]');
    if (card) {
      card.classList.add('flash');
      setTimeout(function() { card.classList.remove('flash'); }, 3000);
    }
  });
}

function buildTicketCard(t, expanded, changed) {
  var sc = statusClass(t.status, t.statusCategory);
  var pc = priorityColor(t.priority);
  var kc = projectColor(t.projectKey);
  var commentsHtml = '';
  if (t.recentComments && t.recentComments.length > 0) {
    t.recentComments.forEach(function(c) {
      commentsHtml += '<div class="comment-item">' +
        '<span class="comment-author">' + escapeHtml(c.author) + '</span>' +
        '<span class="comment-date">' + relTime(c.date) + '</span>' +
        '<div class="comment-snippet">' + escapeHtml(c.snippet) + '</div>' +
        '</div>';
    });
  }
  var lastCommentPreview = '';
  if (t.lastCommentBy && t.lastCommentSnippet) {
    lastCommentPreview = '@' + escapeHtml(t.lastCommentBy) + ': ' + escapeHtml(t.lastCommentSnippet);
  }

  var expandedClass = expanded ? ' expanded' : '';
  var flashClass = changed ? ' flash' : '';

  return '<div class="ticket-card' + expandedClass + flashClass + '" data-ticket-key="' + escapeHtml(t.key) + '" onclick="toggleExpand('' + escapeHtml(t.key) + '')" data-updated="' + escapeHtml(t.updated) + '" data-comments="' + (t.commentsCount || 0) + '">' +
    '<div class="updated-badge">UPDATED</div>' +
    '<div class="ticket-header">' +
      '<span class="ticket-key" style="color:' + kc + '">' + escapeHtml(t.key) + '</span>' +
      '<span class="status-badge ' + sc + '">' + escapeHtml(t.status) + '</span>' +
    '</div>' +
    '<div class="ticket-summary" data-field="summary">' + escapeHtml(t.summary) + '</div>' +
    '<div class="ticket-meta">' +
      '<span class="priority-dot" style="background:' + pc + '" data-field="priority"></span>' +
      '<span data-field="project">' + escapeHtml(t.project) + '</span>' +
      '<span>&middot;</span>' +
      '<span data-field="issuetype">' + escapeHtml(t.issuetype) + '</span>' +
      '<span>&middot;</span>' +
      '<span data-field="updated-rel">updated ' + relTime(t.updated) + '</span>' +
      '<span class="comment-badge" data-field="comments">&#128172; ' + (t.commentsCount || 0) + '</span>' +
    '</div>' +
    '<div class="last-comment-preview" data-field="last-comment">' + lastCommentPreview + '</div>' +
    '<div class="expanded-content">' +
      '<div class="ticket-description" data-field="description">' + escapeHtml(t.description) + '</div>' +
      '<div data-field="comments-list">' + commentsHtml + '</div>' +
      '<div class="action-buttons">' +
        '<button class="action-btn" onclick="event.stopPropagation();toggleInlineAction('' + escapeHtml(t.key) + '','comment')">Add Comment</button>' +
        '<button class="action-btn" onclick="event.stopPropagation();toggleInlineAction('' + escapeHtml(t.key) + '','status')">Change Status</button>' +
      '</div>' +
      '<div class="inline-action-area" id="comment-area-' + escapeHtml(t.key) + '">' +
        '<textarea class="inline-textarea" id="comment-text-' + escapeHtml(t.key) + '" placeholder="Type your comment..."></textarea>' +
        '<button class="inline-submit" onclick="event.stopPropagation();submitComment('' + escapeHtml(t.key) + '')">Submit Comment</button>' +
      '</div>' +
      '<div class="status-dropdown" id="status-area-' + escapeHtml(t.key) + '">' +
        '<div class="status-option" onclick="event.stopPropagation();submitStatus('' + escapeHtml(t.key) + '','In Progress')">In Progress</div>' +
        '<div class="status-option" onclick="event.stopPropagation();submitStatus('' + escapeHtml(t.key) + '','Done')">Done</div>' +
        '<div class="status-option" onclick="event.stopPropagation();submitStatus('' + escapeHtml(t.key) + '','Open')">Open</div>' +
        '<div class="status-option" onclick="event.stopPropagation();submitStatus('' + escapeHtml(t.key) + '','Reopened')">Reopened</div>' +
        '<div class="status-option" onclick="event.stopPropagation();submitStatus('' + escapeHtml(t.key) + '','Closed')">Closed</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function updateTicketCard(card, t, changed) {
  // Only update fields that changed
  var oldUpdated = card.getAttribute('data-updated');
  var oldComments = parseInt(card.getAttribute('data-comments') || '0', 10);

  if (oldUpdated !== t.updated) {
    card.setAttribute('data-updated', t.updated);
    var updEl = card.querySelector('[data-field="updated-rel"]');
    if (updEl) updEl.textContent = 'updated ' + relTime(t.updated);
  }

  if (oldComments !== (t.commentsCount || 0)) {
    card.setAttribute('data-comments', t.commentsCount || 0);
    var cEl = card.querySelector('[data-field="comments"]');
    if (cEl) cEl.innerHTML = '&#128172; ' + (t.commentsCount || 0);
  }

  // Update summary if changed
  var sumEl = card.querySelector('[data-field="summary"]');
  if (sumEl && sumEl.textContent !== t.summary) {
    sumEl.textContent = t.summary;
  }

  // Update last comment preview
  var lcEl = card.querySelector('[data-field="last-comment"]');
  if (lcEl) {
    var preview = '';
    if (t.lastCommentBy && t.lastCommentSnippet) {
      preview = '@' + t.lastCommentBy + ': ' + t.lastCommentSnippet;
    }
    if (lcEl.textContent !== preview) lcEl.textContent = preview;
  }

  // Update status badge
  var badge = card.querySelector('.status-badge');
  if (badge) {
    var sc = statusClass(t.status, t.statusCategory);
    badge.className = 'status-badge ' + sc;
    if (badge.textContent !== t.status) badge.textContent = t.status;
  }

  // Update comments list if expanded
  if (expandedTickets.has(t.key) && t.recentComments) {
    var commentsContainer = card.querySelector('[data-field="comments-list"]');
    if (commentsContainer) {
      var ch = '';
      t.recentComments.forEach(function(c) {
        ch += '<div class="comment-item">' +
          '<span class="comment-author">' + escapeHtml(c.author) + '</span>' +
          '<span class="comment-date">' + relTime(c.date) + '</span>' +
          '<div class="comment-snippet">' + escapeHtml(c.snippet) + '</div>' +
          '</div>';
      });
      commentsContainer.innerHTML = ch;
    }
    // Update description
    var descEl = card.querySelector('[data-field="description"]');
    if (descEl) descEl.textContent = t.description || '';
  }
}

function toggleExpand(key) {
  var card = document.querySelector('[data-ticket-key="' + key + '"]');
  if (!card) return;
  if (expandedTickets.has(key)) {
    expandedTickets.delete(key);
    card.classList.remove('expanded');
  } else {
    expandedTickets.add(key);
    card.classList.add('expanded');
  }
}

function toggleInlineAction(key, type) {
  if (type === 'comment') {
    var area = document.getElementById('comment-area-' + key);
    if (area) area.classList.toggle('show');
    var sa = document.getElementById('status-area-' + key);
    if (sa) sa.classList.remove('show');
  } else {
    var sa2 = document.getElementById('status-area-' + key);
    if (sa2) sa2.classList.toggle('show');
    var ca = document.getElementById('comment-area-' + key);
    if (ca) ca.classList.remove('show');
  }
}

// ===== GITHUB API =====
function createGitHubIssue(title, body, callback) {
  fetch('https://api.github.com/repos/' + GH_OWNER + '/' + BRIDGE_REPO + '/issues', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + GH_TOKEN,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ title: title, body: body || 'Sent from dashboard' })
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (callback) callback(null, data);
    })
    .catch(function(err) {
      if (callback) callback(err, null);
    });
}

function submitComment(key) {
  var textarea = document.getElementById('comment-text-' + key);
  if (!textarea || !textarea.value.trim()) return;
  var comment = textarea.value.trim();
  var title = 'JIRA ACTION: Add comment to ' + key;
  var body = 'Comment: ' + comment + NL + 'Sent from dashboard';
  showToast('Sending comment...', '');
  createGitHubIssue(title, body, function(err, data) {
    if (err || !data || !data.number) {
      showToast('Failed to send command', 'error');
      return;
    }
    showToast('Command sent to aipro (Issue #' + data.number + ')', 'success');
    textarea.value = '';
    document.getElementById('comment-area-' + key).classList.remove('show');
  });
}

function submitStatus(key, status) {
  var title = 'JIRA ACTION: Transition ' + key + ' to ' + status;
  var body = 'Transition ' + key + ' to ' + status + NL + 'Sent from dashboard';
  showToast('Sending status change...', '');
  createGitHubIssue(title, body, function(err, data) {
    if (err || !data || !data.number) {
      showToast('Failed to send command', 'error');
      return;
    }
    showToast('Command sent to aipro (Issue #' + data.number + ')', 'success');
    document.getElementById('status-area-' + key).classList.remove('show');
  });
}

// ===== COMMAND SHEET =====
function openSheet() {
  document.getElementById('sheetBackdrop').classList.add('show');
  document.getElementById('bottomSheet').classList.add('show');
  document.getElementById('commandInput').focus();
  renderHistory();
}

function closeSheet() {
  document.getElementById('sheetBackdrop').classList.remove('show');
  document.getElementById('bottomSheet').classList.remove('show');
}

function sendCommand() {
  var input = document.getElementById('commandInput');
  var cmd = input.value.trim();
  if (!cmd) return;
  var btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  createGitHubIssue(cmd, 'Sent from dashboard', function(err, data) {
    btn.disabled = false;
    btn.textContent = 'Send';
    if (err || !data || !data.number) {
      showToast('Failed to send command', 'error');
      return;
    }
    input.value = '';
    showToast('Command sent! Issue #' + data.number + ' created. Response will appear when aipro processes it.', 'success');

    // Save to history
    var history = JSON.parse(localStorage.getItem('cmdHistory') || '[]');
    history.unshift({
      command: cmd,
      timestamp: Date.now(),
      issueNum: data.number,
      response: null
    });
    localStorage.setItem('cmdHistory', JSON.stringify(history));
    pollIssueNumbers.push({ issueNum: data.number, historyIdx: 0 });
    renderHistory();
  });
}

function renderHistory() {
  var history = JSON.parse(localStorage.getItem('cmdHistory') || '[]');
  var list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = '<div class="bridge-stat">No history yet</div>';
    return;
  }
  var html = '';
  history.forEach(function(h) {
    html += '<div class="history-item">' +
      '<div class="history-cmd">' + escapeHtml(h.command) + '</div>' +
      '<div class="history-time">' + relTime(new Date(h.timestamp).toISOString()) + ' (Issue #' + h.issueNum + ')</div>';
    if (h.response) {
      html += '<div class="history-response">' + escapeHtml(h.response) + '</div>';
    } else {
      html += '<div class="history-pending">Waiting for response...</div>';
    }
    html += '</div>';
  });
  list.innerHTML = html;
}

function toggleHistory() {
  var list = document.getElementById('historyList');
  var arrow = document.getElementById('historyArrow');
  list.classList.toggle('show');
  arrow.classList.toggle('open');
}

function pollCommandResponses(data) {
  if (!data.agent || !data.agent.recentActivity) return;
  var history = JSON.parse(localStorage.getItem('cmdHistory') || '[]');
  var updated = false;
  data.agent.recentActivity.forEach(function(act) {
    history.forEach(function(h) {
      if (h.issueNum === act.issueNum && !h.response) {
        h.response = act.responseSnippet || 'Processed';
        updated = true;
      }
    });
  });
  if (updated) {
    localStorage.setItem('cmdHistory', JSON.stringify(history));
    renderHistory();
  }
}

// ===== LIVE UPTIME UPDATES =====
var uptimeBase = null;
function updateLiveUptimes() {
  if (!rawData || !rawData.agent) return;
  var agent = rawData.agent;
  // Update bridge uptime
  var upEl = document.getElementById('bridgeUptime');
  if (upEl && agent.startTime) {
    var elapsed = Math.floor((Date.now() - new Date(agent.startTime).getTime()) / 1000);
    upEl.textContent = 'Uptime: ' + fmtUptime(elapsed);
  }
  // Update IDE session uptimes
  var ideSessions = agent.ideSessions || [];
  ideSessions.forEach(function(s) {
    // ageSeconds is static from server, increment locally
    if (!s._localAge) s._localAge = s.ageSeconds || 0;
    s._localAge++;
    var ideItems = document.querySelectorAll('.ide-item');
    ideItems.forEach(function(item) {
      var text = item.querySelector('.bridge-stat');
      if (text && text.textContent.indexOf('PID: ' + s.pid) >= 0) {
        text.innerHTML = 'PID: ' + s.pid + ' &middot; ' + fmtUptime(s._localAge);
      }
    });
  });
}

// ===== RELATIVE TIME UPDATES =====
function updateRelativeTimes() {
  if (!rawData || !rawData.tickets) return;
  var cards = document.querySelectorAll('[data-ticket-key]');
  cards.forEach(function(card) {
    var key = card.getAttribute('data-ticket-key');
    var updated = card.getAttribute('data-updated');
    var el = card.querySelector('[data-field="updated-rel"]');
    if (el && updated) {
      el.textContent = 'updated ' + relTime(updated);
    }
  });
  // Update history times
  renderHistory();
  // Update sidebar activity times
  if (rawData.agent && rawData.agent.recentActivity) {
    rawData.agent.recentActivity.forEach(function(a) {
      if (a.responded) {
        var items = document.querySelectorAll('.activity-item');
        items.forEach(function(item) {
          var title = item.querySelector('.activity-title');
          if (title && title.textContent.indexOf('#' + a.issueNum) >= 0) {
            var time = item.querySelector('.activity-time');
            if (time) time.textContent = relTime(a.responded);
          }
        });
      }
    });
  }
}

// ===== SEARCH =====
document.getElementById('searchInput').addEventListener('input', function(e) {
  searchTerm = e.target.value;
  if (rawData) renderTickets(rawData, []);
});

// ===== INIT =====
fetchData();
setInterval(fetchData, 10000);
setInterval(updateRefreshTime, 5000);
setInterval(updateRelativeTimes, 30000);
setInterval(updateLiveUptimes, 1000);

// Prevent body scroll on iOS
document.addEventListener('touchmove', function(e) {
  if (e.target.closest('.tickets-list') || e.target.closest('.bottom-sheet') || e.target.closest('.sidebar-panel')) return;
  e.preventDefault();
}, { passive: false });
</script>
